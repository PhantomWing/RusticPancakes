modLoader="javafml"
loaderVersion="${loader_version_range}"
issueTrackerURL = "https://github.com/PhantomWing/RusticPancakes/issues"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
displayURL="https://github.com/PhantomWing/RusticPancakes"
# 26.2 deprecated logoFile, splitting it into a wide banner and a square icon; logo.png is square.
iconFile = "logo.png"
logoBlur=false
credits=""
authors="${mod_authors}"
description='''${mod_description}'''
## Catalogue mod compatibility
itemIcon = "rusticpancakes:chocolate_pancakes"
configBackground = "minecraft:textures/block/bricks.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="architectury"
type="required"
versionRange="[${architectury_min_version},)"
ordering="AFTER"
side="BOTH"
