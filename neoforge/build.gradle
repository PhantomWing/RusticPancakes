plugins {
    id 'com.gradleup.shadow' version '9.4.2'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

// Resolved outside loom { runs { } } so the paths are visible inside the run's delegate.
def datagenModId = rootProject.property('mod_id').toString()
def datagenOutput = rootProject.file('common/src/generated/resources/').absolutePath
def datagenExisting = rootProject.file('common/src/main/resources/').absolutePath

def runningGameTest = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }
def runningDataGen = gradle.startParameter.taskNames.any { it.toLowerCase().contains('data') }

loom {
    runs {
        // Datagen output is shared by both loaders, so it goes to common.
        //   ./gradlew :neoforge:runData
        // NeoForge 21.4 split the `data` run type into clientData and serverData, and data() names the old one. The
        // client run is a full client, so with --all it emits the models and the server data together.
        data {
            clientData()
            name = "Data Generation"
            programArgs('--mod', datagenModId, '--all', '--output', datagenOutput, '--existing', datagenExisting)
        }

        // Runs every registered test headless - the mod's and vanilla's always_pass - prints PASS/FAIL, and exits.
        //   ./gradlew :neoforge:runGameTest
        // From NeoForge 21.5 the game-test properties do nothing and server() just idles as a dedicated server: the
        // gameTestServer template both enables and runs the tests. The environment picks launch.cfg's section, so it
        // has to name the same template.
        gameTest {
            environment('gameTestServer')
            forgeTemplate('gameTestServer')
            name = "Game Test"
            runDir "run/gametest"
            source sourceSets.test
            // The test classes join the mod in this run only: NeoForge 21.5 fires RegisterGameTestsEvent again as a dev
            // dedicated server starts, into registries already frozen, and runServer crashed with them on its classpath.
            mods {
                "${datagenModId}" {
                    sourceSet sourceSets.main
                    sourceSet sourceSets.test
                }
            }
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

// Game tests, kept out of `main` so neither the test classes nor their structure ship.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

// The test source set holds game tests, which runGameTest runs; the JUnit `test` task finds none there, and Gradle 9
// fails a build whose test task discovers nothing.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    api "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ':common')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }

    // Dev-runtime niceties: never compiled against, never shipped, never a dependency. Left out of the
    // game-test and datagen runs, where they only add load time and ways to fail.
    if (!runningGameTest && !runningDataGen) {
        localRuntime("squeek.appleskin:appleskin-neoforge:${rootProject.appleskin_neoforge_version}")
        localRuntime("mezz.jei:jei-${rootProject.minecraft_version}-neoforge:${rootProject.jei_version}")
    }
}

processResources {
    def tomlProps = [
            version                : project.version,
            mod_id                 : rootProject.mod_id,
            mod_name               : rootProject.mod_name,
            mod_description        : rootProject.mod_description,
            mod_authors            : rootProject.mod_authors,
            mod_license            : rootProject.mod_license,
            loader_version_range   : rootProject.loader_version_range,
            neo_version_range      : rootProject.neo_version_range,
            minecraft_version_range: rootProject.minecraft_version_range,
            architectury_min_version: rootProject.architectury_min_version,
    ]
    inputs.properties tomlProps

    filesMatching('META-INF/neoforge.mods.toml') {
        expand tomlProps
    }
}

// No remapJar without remapping: the Loom-processed jar is marked raw and Shadow builds on top of it, merging in
// :common. shadowJar is the shipped jar.
jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

// Publishing (NeoForge jar). ./gradlew :neoforge:publishMods (tokens via MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars).
apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
    file = shadowJar.archiveFile
    version = rootProject.mod_version
    displayName = "Rustic Pancakes ${rootProject.mod_version}"
    changelog = rootProject.ext.latestChangelog()
    type = STABLE
    modLoaders.add("neoforge")
    // -PpublishDryRun => stage to build/ without uploading.
    dryRun = project.hasProperty("publishDryRun")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        // Tagged with what neoforge_minecraft_versions lists, which leaves out a covered version NeoForge has no build for.
        rootProject.neoforge_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        requires("architectury-api")
    }
    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        rootProject.neoforge_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // CurseForge requires explicit side flags (Modrinth infers them from the jar).
        client = true
        server = true
        requires("architectury-api")
    }
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// Publishing takes the shipped jar rather than the raw one, which lacks :common.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }
}
