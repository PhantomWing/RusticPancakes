plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

// Resolved outside loom { runs { } } so the paths are visible inside the run's delegate.
def datagenModId = rootProject.property('mod_id').toString()
def datagenOutput = rootProject.file('common/src/generated/resources/').absolutePath
def datagenExisting = rootProject.file('common/src/main/resources/').absolutePath

loom {
    // The game tests join the dev mod through Loom's own `main` group. A second group for the same mod
    // hands the loader two copies, and some FML releases keep the one without the tests (none run).
    // Dev-runtime only: the shipped jar is still built from `main`.
    mods {
        named('main') {
            sourceSet sourceSets.test
        }
    }

    runs {
        // Datagen output is shared by both loaders, so it goes to common.
        //   ./gradlew :neoforge:runData
        data {
            data()
            name = "Data Generation"
            programArgs('--mod', datagenModId, '--all', '--output', datagenOutput, '--existing', datagenExisting)
        }

        // Runs every game test in the mod's namespace headless, prints PASS/FAIL, and exits.
        //   ./gradlew :neoforge:runGameTest
        gameTest {
            server()
            name = "Game Test"
            runDir "run/gametest"
            source sourceSets.test
            property 'neoforge.enableGameTest', 'true'
            property 'neoforge.gameTestServer', 'true'
            property 'neoforge.enabledGameTestNamespaces', datagenModId
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

// Game tests, kept out of `main` so neither the test classes nor their structure ship.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }
}

processResources {
    def tomlProps = [
            version                : project.version,
            mod_id                 : rootProject.mod_id,
            mod_name               : rootProject.mod_name,
            mod_description        : rootProject.mod_description,
            mod_authors            : rootProject.mod_authors,
            mod_license            : rootProject.mod_license,
            loader_version_range   : rootProject.loader_version_range,
            neo_version_range      : rootProject.neo_version_range,
            minecraft_version_range: rootProject.minecraft_version_range,
            architectury_version   : rootProject.architectury_version,
    ]
    inputs.properties tomlProps

    filesMatching('META-INF/neoforge.mods.toml') {
        expand tomlProps
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }
}
