## Mod info
mod_version=1.2.0
mod_id=rusticpancakes
mod_group_id=com.phantomwing.rusticpancakes
mod_license=All Rights Reserved
mod_name=Rustic Pancakes
mod_description=A rustic mod that lets you bake different types of Pancakes, and place them in your world!
mod_authors=PhantomWing

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Architectury Loom requires the Gradle daemon itself to run on JDK 25. The system
# default `java` may be an older JDK, so the daemon JVM is pinned explicitly here.
# Adjust this path (or override it with -Dorg.gradle.java.home=, as CI does) if your
# JDK 25 lives elsewhere.
org.gradle.java.home=C\:\\Users\\calvi\\.jdks\\temurin-25.0.3
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is not compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=26.2
minecraft_version_range=[26.2,26.2.1)
# Game versions tagged on the Modrinth/CurseForge uploads (space or comma separated): the whole rung.
supported_minecraft_versions=26.2
# The NeoForge upload's tags. The rung covers 26.2 alone, so they are the same as the Fabric upload's.
neoforge_minecraft_versions=26.2
neo_version=26.2.0.88
neo_version_range=[26.2,)
loader_version_range=[4,)

# Architectury / multi-loader
architectury_plugin_version=3.5.169
architectury_loom_version=1.17.483
# Architectury API 21.0.x registers for an event NeoForge 26.2.0.88 dropped and dies before the game starts; 21.1.10 loads
# on it, so it is the manifests' floor too.
architectury_version=21.1.10
architectury_min_version=21.1.10
enabled_platforms=fabric,neoforge

# Fabric
# Architectury 21.1.10 needs Fabric Loader 0.19.5 and Fabric API 0.160.0, so they are the line's, and fabric.mod.json's floors.
fabric_loader_version=0.19.5
fabric_api_version=0.160.0+26.2
fabric_api_min_version=0.160.0

# Dev-runtime only: loaded in runClient and runServer, never compiled against or shipped.
appleskin_fabric_version=mc26.2-3.0.10
appleskin_neoforge_version=mc26.2-3.0.10
cloth_config_version=26.2.155
jei_version=30.35.0.223

# Publishing - Modrinth / CurseForge project IDs (public identifiers, not secrets).
# Tokens come from the account-wide MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars in CI, falling back
# to modrinth_token / curseforge_token in the global ~/.gradle/gradle.properties for local runs.
mod_publish_plugin_version=2.0.0
modrinth_project_id=coJ1i4xo
curseforge_project_id=1144166
