## Mod info
mod_version=1.2.0
mod_id=rusticpancakes
mod_group_id=com.phantomwing.rusticpancakes
mod_license=All Rights Reserved
mod_name=Rustic Pancakes
mod_description=A rustic mod that lets you bake different types of Pancakes, and place them in your world!
mod_authors=PhantomWing

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Architectury Loom requires the Gradle daemon itself to run on JDK 25. The system
# default `java` may be an older JDK, so the daemon JVM is pinned explicitly here.
# Adjust this path (or override it with -Dorg.gradle.java.home=, as CI does) if your
# JDK 25 lives elsewhere.
org.gradle.java.home=C\:\\Users\\calvi\\.jdks\\temurin-25.0.3
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is not compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=26.1.2
minecraft_version_range=[26.1,26.1.3)
# Game versions tagged on the Modrinth/CurseForge uploads (space or comma separated): the whole rung.
supported_minecraft_versions=26.1 26.1.1 26.1.2
# NeoForge 26.1.2 exists for Minecraft 26.1.2 alone, so the NeoForge upload is tagged with it alone.
neoforge_minecraft_versions=26.1.2
neo_version=26.1.2.75
neo_version_range=[26.1.2,)
loader_version_range=[4,)

# Architectury / multi-loader
architectury_plugin_version=3.5.167
architectury_loom_version=1.17.477
architectury_version=20.0.5
# The lowest Architectury API the manifests ask for: 20.0.5 and newer are for 26.1.2 alone, and 20.0.4 is the newest
# for 26.1 and 26.1.1, which the Fabric upload is tagged for too.
architectury_min_version=20.0.4
enabled_platforms=fabric,neoforge

# Fabric
fabric_loader_version=0.19.3
fabric_api_version=0.151.0+26.1.2
# The lowest Fabric API fabric.mod.json asks for. Fabric API's 26.1.2 builds are tagged 26.1 and 26.1.1 too.
fabric_api_min_version=0.151.0

# Dev-runtime only: loaded in runClient and runServer, never compiled against or shipped.
appleskin_fabric_version=mc26.1.2-3.0.10
appleskin_neoforge_version=mc26.1-3.0.9
cloth_config_version=26.1.154
jei_version=29.6.2.31

# Publishing - Modrinth / CurseForge project IDs (public identifiers, not secrets).
# Tokens come from the account-wide MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars in CI, falling back
# to modrinth_token / curseforge_token in the global ~/.gradle/gradle.properties for local runs.
mod_publish_plugin_version=2.0.0
modrinth_project_id=coJ1i4xo
curseforge_project_id=1144166
