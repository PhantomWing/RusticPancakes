plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    // Publishing - applied per loader subproject.
    id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_plugin_version}" apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Per-release changelog: notes under the first "# X.Y.Z" header in changelog.md, up to the next "# ".
ext.latestChangelog = {
    def f = rootProject.file('changelog.md')
    if (!f.exists()) return "See changelog.md"
    def body = new StringBuilder()
    boolean started = false, done = false
    f.eachLine { line ->
        if (done) return
        if (line.startsWith('# ')) {
            if (started) { done = true; return }
            started = true
            return
        }
        if (started) body.append(line).append('\n')
    }
    def out = body.toString().trim()
    return out.isEmpty() ? "See changelog.md" : out
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // Mojang official mappings, layered with Parchment.
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
        }
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${mod_id}-${project.name}-${minecraft_version}"
    }

    version = mod_version
    group = mod_group_id

    repositories {
        mavenLocal()

        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }

        // AppleSkin (dev-runtime only)
        maven {
            url = "https://maven.ryanliptak.com/"
        }

        // Cloth Config (dev-runtime only: AppleSkin needs it on Fabric). Scoped to its group so this
        // maven doesn't broaden resolution for anything else.
        maven {
            name = "shedaniel"
            url = "https://maven.shedaniel.me/"
            content { includeGroup "me.shedaniel.cloth" }
        }
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    java {
        withSourcesJar()
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}
