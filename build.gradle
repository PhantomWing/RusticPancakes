plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    // loom-no-remap: 26.x is unobfuscated, so there are no mappings and no remapJar; common is bundled via Shadow.
    id 'dev.architectury.loom-no-remap' version "${architectury_loom_version}" apply false
    // Publishing - applied per loader subproject.
    id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_plugin_version}" apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Per-release changelog: notes under the first "# X.Y.Z" header in changelog.md, up to the next "# ".
ext.latestChangelog = {
    def f = rootProject.file('changelog.md')
    if (!f.exists()) return "See changelog.md"
    def body = new StringBuilder()
    boolean started = false, done = false
    f.eachLine { line ->
        if (done) return
        if (line.startsWith('# ')) {
            if (started) { done = true; return }
            started = true
            return
        }
        if (started) body.append(line).append('\n')
    }
    def out = body.toString().trim()
    return out.isEmpty() ? "See changelog.md" : out
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'

    loom {
        silentMojangMappingsLicense()

        // Two JVM arguments from Mojang's 26.3 version manifest that Loom doesn't pass to dev runs (the portal
        // adds them to its runs too). Without StackShadowPages=32 the client died natively on Windows in about
        // 4 of 10 starts while compiling shaders; the export puts LWJGL on its production memory backend.
        runs {
            configureEach {
                vmArg '-XX:StackShadowPages=32'
                vmArgs '--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED'
            }
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // No mappings: Mojang's names are the runtime names, and there is no mappings file to read.
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${mod_id}-${project.name}-${minecraft_version}"
    }

    version = mod_version
    group = mod_group_id

    repositories {
        mavenLocal()

        maven { url = 'https://maven.neoforged.net/releases' }

        // AppleSkin (dev-runtime only)
        maven {
            url = "https://maven.ryanliptak.com/"
        }

        // JEI (dev-runtime only)
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
            // JEI needs mezz_config from 30 on, which this maven serves too.
            content {
                includeGroup "mezz.jei"
                includeGroup "net.mezzdev.config"
            }
        }

        // Cloth Config (dev-runtime only: AppleSkin needs it on Fabric). Scoped to its group so this
        // maven doesn't broaden resolution for anything else.
        maven {
            name = "shedaniel"
            url = "https://maven.shedaniel.me/"
            content { includeGroup "me.shedaniel.cloth" }
        }
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    java {
        withSourcesJar()
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}
